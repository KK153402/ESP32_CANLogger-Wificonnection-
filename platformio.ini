; ============================================================
; CANログ取得治具 — PlatformIO プロジェクト設定
;
;   ターゲット : ESP32-WROOM-32E-N16
;   フレームワーク : arduino-esp32 2.0.17
;
; 使い方
;   pio run                 ビルド
;   pio run -t upload       書き込み
;   pio device monitor      シリアルモニタ
;   pio run -e ch1_only     CH1のみでビルド（MCP2515未実装の試作基板用）
; ============================================================

[platformio]
default_envs = esp32dev

; ------------------------------------------------------------
; 共通設定
; ------------------------------------------------------------
[env]
; バージョンを固定する。espressif32 6.8.1 = arduino-esp32 2.0.17。
; 本ファームは driver/twai.h を直接叩いており、arduino-esp32 3.x では
; API/ヘッダ構成が変わるためビルドが通らない。
; （3.x系はEspressifがPlatformIO公式サポートを終了し pioarduino フォークへ移行）
platform  = espressif32@6.8.1
board     = esp32dev
framework = arduino

; ESP32-WROOM-32E-N16 は16MBフラッシュ。既定の4MB設定のままだと容量を活かせない。
board_upload.flash_size = 16MB
board_build.flash_mode  = dio
board_build.partitions  = default_16MB.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

upload_speed = 921600

build_flags =
    -Wall
    -Wextra
    ; FreeRTOSタスク関数の未使用引数など、Arduinoコア側由来の警告を抑える
    -Wno-unused-parameter

; 外部ライブラリは使用しない。
; SD / SPI / Wire はフレームワーク同梱、MCP2515ドライバは src/mcp2515.h に自前実装。
lib_deps =

; ------------------------------------------------------------
; 通常構成（CH1 + CH2）
; ------------------------------------------------------------
[env:esp32dev]

; ------------------------------------------------------------
; CH1のみ構成（MCP2515を実装していない試作基板の検証用）
;   config.h 側に #ifndef ガードがあるので -D で上書きできる
; ------------------------------------------------------------
[env:ch1_only]
build_flags =
    ${env.build_flags}
    -DCH2_ENABLE=0

; ------------------------------------------------------------
; RTC無し構成（MCP7940N未実装の試作基板の検証用）
;   unix_time は 0 になり、PC側は --start 指定または
;   ファイル更新時刻へフォールバックする
; ------------------------------------------------------------
[env:no_rtc]
build_flags =
    ${env.build_flags}
    -DRTC_ENABLE=0

; ------------------------------------------------------------
; ASCテキスト保存構成（現地でログの中身をテキスト確認したいとき）
;   スループットに余裕が無くなるので常用しないこと（docs/DESIGN.md §2.3）
; ------------------------------------------------------------
[env:asc_format]
build_flags =
    ${env.build_flags}
    -DLOG_FORMAT=1
